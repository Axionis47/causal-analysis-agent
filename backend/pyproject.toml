[tool.poetry]
name = "causal-analysis-backend"
version = "0.1.0"
description = "Production-grade causal analysis multi-agent system backend"
authors = ["Causal Analysis Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
redis = "^5.0.1"
celery = {extras = ["redis"], version = "^5.3.6"}
pydantic = {extras = ["email"], version = "^2.6.0"}
pydantic-settings = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.0.1"  # Pin to 4.0.x for passlib compatibility
httpx = "^0.27.0"
sseclient-py = "^1.8.0"
python-multipart = "^0.0.6"
sse-starlette = "^2.0.0"
langchain = "^0.2.0"
langgraph = "^0.2.0"
langsmith = "^0.1.0"
langchain-core = "^0.2.0"
google-cloud-aiplatform = "^1.40.0"
openai = "^1.10.0"
anthropic = "^0.14.0"
pandas = "^2.2.0"
numpy = "^1.26.3"
scikit-learn = "^1.4.0"
dowhy = "^0.11.1"
causal-learn = "^0.1.3.7"
networkx = "^3.2.1"
plotly = "^5.18.0"
kaleido = ">=0.2.1"
google-cloud-storage = "^2.14.0"
kaggle = "^1.6.6"
tenacity = "^8.2.3"
pyyaml = "^6.0.1"
econml = "^0.15.0"
slowapi = "^0.1.9"
structlog = "^24.1.0"
sentry-sdk = {extras = ["fastapi"], version = "^1.40.0"}
python-json-logger = "^2.0.7"
weasyprint = "^60.0"
jinja2 = "^3.1.3"
python-pptx = "^0.6.21"
bleach = "^6.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.4"
pytest-cov = "^4.1.0"
httpx = "^0.27.0"
ruff = "^0.2.0"
black = "^24.1.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
faker = "^22.5.1"
aiosqlite = "^0.19.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"
